name: Build VST3 & AU Plugins

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos:
    name: macOS Universal (VST3 + AU)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3 and Audio Unit (.component)
        run: cmake --build build --config Release --target HaldenReverb6_VST3 HaldenReverb6_AU -j 4

      - name: Collect macOS Artifacts
        run: |
          mkdir -p dist-macos
          find build -type d ( -name "*.vst3" -o -name "*.component" ) -prune -exec cp -R {} dist-macos/ ;
          ls -la dist-macos

      - name: Upload macOS VST3 & AU
        uses: actions/upload-artifact@v4
        with:
          name: HaldenReverb6-macOS-VST3-AU
          path: dist-macos/

  build-windows:
    name: Windows x64 (VST3)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3
        run: cmake --build build --config Release --target HaldenReverb6_VST3

      - name: Collect Windows Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-windows | Out-Null
          Get-ChildItem -Path build -Recurse -Directory -Filter "*.vst3" | ForEach-Object {
            Copy-Item -Recurse -Force -Path $_.FullName -Destination "dist-windows/"
          }
          Get-ChildItem dist-windows

      - name: Upload Windows VST3
        uses: actions/upload-artifact@v4
        with:
          name: HaldenReverb6-Windows-VST3
          path: dist-windows/
